[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "luci"
version = "0.1.0"
description = "Luci Python SDK - One Runtime. Infinite Resources."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Luci Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["distributed", "computing", "runtime", "cluster"]
dependencies = []

[project.urls]
Homepage = "https://github.com/luci-dev/luci"
Documentation = "https://luci.dev/docs"
Repository = "https://github.com/luci-dev/luci"
Issues = "https://github.com/luci-dev/luci/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
